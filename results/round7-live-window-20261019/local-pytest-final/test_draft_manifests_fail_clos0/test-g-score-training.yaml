apiVersion: scheduling.volcano.sh/v1beta1
kind: PodGroup
metadata:
  name: rf-v7-g-score-training
  labels:
    gpu-lab/experiment: round7-rf
  namespace: gpu-rf-tests
spec:
  minMember: 1
  queue: rf-v7-queue
---
apiVersion: v1
kind: Pod
metadata:
  name: rf-v7-g-score-training
  labels:
    gpu-lab/experiment: round7-rf
    gpu-lab/workload-type: training
    gpu-lab/case: g-score-training
  namespace: gpu-rf-tests
  annotations:
    scheduling.k8s.io/group-name: rf-v7-g-score-training
spec:
  schedulerName: volcano-rf-test
  runtimeClassName: nvidia
  restartPolicy: Never
  automountServiceAccountToken: false
  activeDeadlineSeconds: 900
  terminationGracePeriodSeconds: 5
  nodeSelector:
    gpu-lab/partition: rf-exclusive-v7
    kubernetes.io/hostname: rf-exclusive-node-required
  tolerations:
  - key: gpu-lab/reserved
    operator: Equal
    value: rf-exclusive-v7
    effect: NoSchedule
  containers:
  - name: sleep
    image: docker.io/pytorch/pytorch@sha256:923f687790bec78081c357e71dcd5dcef80b0cc00f6c34484902a5e83362c854
    imagePullPolicy: Never
    command:
    - /bin/sleep
    - '600'
    resources:
      requests:
        volcano.sh/vgpu-number: 1
        volcano.sh/vgpu-memory: 4096
        volcano.sh/vgpu-cores: 20
        cpu: 100m
        memory: 128Mi
      limits:
        volcano.sh/vgpu-number: 1
        volcano.sh/vgpu-memory: 4096
        volcano.sh/vgpu-cores: 20
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
