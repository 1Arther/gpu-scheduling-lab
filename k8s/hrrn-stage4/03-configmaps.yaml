apiVersion: v1
kind: ConfigMap
metadata:
  name: hrrn-s4-device-config
  namespace: hrrn-lab-system
data:
  device-config.yaml: "nvidia:\n  resourceCountName: volcano.sh/vgpu-number\n  resourceMemoryName:\
    \ volcano.sh/vgpu-memory\n  resourceCoreName: volcano.sh/vgpu-cores\n  resourceMemoryPercentageName:\
    \ volcano.sh/vgpu-memory-percentage\n  defaultGPUNum: 1\n  defaultMemory: 0\n\
    \  defaultCores: 0\n  deviceSplitCount: 10\n  deviceMemoryScaling: 1\n  deviceCoreScaling:\
    \ 1\n  disableCoreLimit: false\n"
