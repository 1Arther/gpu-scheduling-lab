apiVersion: v1
kind: ConfigMap
metadata:
  name: hrrn-s4-a-native-rf
  namespace: hrrn-lab-system
data:
  volcano-scheduler.conf: "actions: enqueue, allocate, backfill\ntiers:\n- plugins:\n\
    \  - name: priority\n  - name: gang\n    enablePreemptable: false\n  - name: conformance\n\
    - plugins:\n  - name: overcommit\n  - name: drf\n    enablePreemptable: false\n\
    \  - name: predicates\n    arguments:\n      predicate.CacheEnable: false\n  -\
    \ name: proportion\n  - name: nodeorder\n  - name: binpack\n  - name: deviceshare\n\
    \    arguments:\n      deviceshare.VGPUEnable: true\n      deviceshare.GPUSharingEnable:\
    \ false\n      deviceshare.GPUNumberEnable: false\n      deviceshare.NodeLockEnable:\
    \ true\n      deviceshare.SchedulePolicy: binpack\n      deviceshare.ScheduleWeight:\
    \ 1\n      deviceshare.GPUSelectPolicy: rf-job\n      deviceshare.RFEnable: true\n\
    \      deviceshare.RFPredictionEnabled: true\n      deviceshare.RFEndpoint: http://127.0.0.1:18081/v1/rank\n\
    \      deviceshare.RFModelVersion: rf-v4-known-states-ee35cfabe30f\n      deviceshare.RFTimeoutMS:\
    \ 1000\n      deviceshare.KnownGeometriesCMName: hrrn-s4-device-config\n     \
    \ deviceshare.KnownGeometriesCMNamespace: hrrn-lab-system\n  - name: hrrn\n  \
    \  enableJobOrder: true\n    enableJobReady: true\n    arguments:\n      enabled:\
    \ false\n      complete-job: false\n      tau-seconds: 1.0\n      default-duration-seconds:\
    \ 60.0\n"
---
