apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata:
  name: hrrn-s4-queue
spec:
  weight: 1
  reclaimable: false
  parent: root
  capability:
    cpu: '4'
    memory: 8Gi
    volcano.sh/vgpu-number: '8'
    volcano.sh/vgpu-memory: '65536'
    volcano.sh/vgpu-cores: '800'
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hrrn-s4-budget
  namespace: hrrn-lab-tests
spec:
  hard:
    pods: '16'
    requests.cpu: '4'
    requests.memory: 8Gi
    requests.volcano.sh/vgpu-number: '16'
    requests.volcano.sh/vgpu-memory: '131072'
    requests.volcano.sh/vgpu-cores: '1600'
