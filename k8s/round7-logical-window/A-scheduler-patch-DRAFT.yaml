spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      automountServiceAccountToken: false
      containers:
      - name: volcano-scheduler
        image: gpu-lab/volcano-rf:canary-build-required
        command:
        - /vc-scheduler-rf
        volumeMounts:
        - mountPath: /vc-scheduler
          $patch: delete
        - name: rf-api-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      - name: rf-model
        image: gpu-lab/rf-model:round7-build-required
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - gpu_lab.runtime.audit_server
        - --port
        - '18081'
        env:
        - name: OMP_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        readinessProbe:
          exec:
            command: &id001
            - python
            - -c
            - import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:18081/health',timeout=1));
              assert r['model_ready'] and r['model_version']=='rf-v4-known-states-ee35cfabe30f'
          periodSeconds: 3
        startupProbe:
          exec:
            command: *id001
          periodSeconds: 2
          failureThreshold: 30
        volumeMounts:
        - name: rf-tmp
          mountPath: /tmp
      volumes:
      - name: local-vc-scheduler
        $patch: delete
      - name: volcano-scheduler-config
        configMap:
          name: rf-v7-canary-config
      - name: rf-tmp
        emptyDir: {}
      - name: rf-api-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
