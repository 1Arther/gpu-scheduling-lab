apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rf-v7-gpu-window
  labels:
    gpu-lab/experiment: round7-rf
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
  variables:
  - name: containers
    expression: 'object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers
      : [])'
  - name: dra
    expression: has(object.spec.resourceClaims) && object.spec.resourceClaims.size()
      > 0
  - name: preallocated
    expression: has(object.metadata.annotations) && object.metadata.annotations.exists(k,
      k in ['volcano.sh/vgpu-ids-new','volcano.sh/devices-to-allocate','volcano.sh/vgpu-node'])
  - name: gpu
    expression: variables.dra || variables.preallocated || variables.containers.exists(c,
      has(c.resources) && ((has(c.resources.limits) && c.resources.limits.exists(k,
      k == 'nvidia.com/gpu' || k.startsWith('volcano.sh/vgpu-'))) || (has(c.resources.requests)
      && c.resources.requests.exists(k, k == 'nvidia.com/gpu' || k.startsWith('volcano.sh/vgpu-')))))
  validations:
  - expression: '!variables.gpu || ((object.metadata.namespace == ''gpu-rf-tests'')
      && (has(object.metadata.labels) && ''gpu-lab/experiment'' in object.metadata.labels
      && object.metadata.labels[''gpu-lab/experiment''] == ''round7-rf'') && (''gpu-lab/workload-type''
      in object.metadata.labels && object.metadata.labels[''gpu-lab/workload-type'']
      in [''training'',''inference'']) && (object.metadata.name.startsWith(''rf-v7-''))
      && (object.spec.schedulerName == ''volcano-rf-test'') && (!has(object.spec.nodeName)
      || object.spec.nodeName == '''') && (has(object.spec.nodeSelector) && ''kubernetes.io/hostname''
      in object.spec.nodeSelector && object.spec.nodeSelector[''kubernetes.io/hostname'']
      == ''t3dgq'') && (has(object.spec.runtimeClassName) && object.spec.runtimeClassName
      == ''nvidia'') && (!variables.dra) && (!variables.preallocated) && (!has(object.spec.initContainers)
      || object.spec.initContainers.size() == 0) && (object.spec.containers.size()
      == 1) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostNetwork)
      || !object.spec.hostNetwork) && (!has(object.spec.volumes) || object.spec.volumes.size()
      == 0) && (has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken)
      && (object.spec.containers.all(c, (c.image == ''docker.io/pytorch/pytorch@sha256:923f687790bec78081c357e71dcd5dcef80b0cc00f6c34484902a5e83362c854'')
      && (has(c.command) && c.command == [''/bin/sleep'',''600'']) && (!has(c.args)
      || c.args.size() == 0) && (!has(c.env) || c.env.size() == 0) && (!has(c.envFrom)
      || c.envFrom.size() == 0) && (!has(c.lifecycle)) && (!has(c.livenessProbe))
      && (!has(c.startupProbe)) && (!has(c.readinessProbe)) && (has(c.resources) &&
      has(c.resources.requests) && has(c.resources.limits)) && (''volcano.sh/vgpu-number''
      in c.resources.requests && c.resources.requests[''volcano.sh/vgpu-number'']
      == ''1'') && (''volcano.sh/vgpu-memory'' in c.resources.requests && c.resources.requests[''volcano.sh/vgpu-memory'']
      == ''4096'') && (''volcano.sh/vgpu-cores'' in c.resources.requests && c.resources.requests[''volcano.sh/vgpu-cores'']
      == ''20'') && (c.resources.requests.all(k, !(k == ''nvidia.com/gpu'' || k.startsWith(''volcano.sh/vgpu-''))
      || k in [''volcano.sh/vgpu-number'',''volcano.sh/vgpu-memory'',''volcano.sh/vgpu-cores'']))
      && (''volcano.sh/vgpu-number'' in c.resources.limits && c.resources.limits[''volcano.sh/vgpu-number'']
      == ''1'') && (''volcano.sh/vgpu-memory'' in c.resources.limits && c.resources.limits[''volcano.sh/vgpu-memory'']
      == ''4096'') && (''volcano.sh/vgpu-cores'' in c.resources.limits && c.resources.limits[''volcano.sh/vgpu-cores'']
      == ''20'') && (c.resources.limits.all(k, !(k == ''nvidia.com/gpu'' || k.startsWith(''volcano.sh/vgpu-''))
      || k in [''volcano.sh/vgpu-number'',''volcano.sh/vgpu-memory'',''volcano.sh/vgpu-cores''])))))'
    message: 'RF logical-allocation window: new GPU/DRA Pods are paused except approved
      sleep cases. Contact experiment owner; no existing GPU Pod is deleted.'
