apiVersion: v1
kind: ServiceAccount
metadata:
  name: volcano-rf-test
  labels:
    gpu-lab/experiment: round7-rf
  namespace: gpu-rf-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rf-v7-scheduler
  labels:
    gpu-lab/experiment: round7-rf
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  - namespaces
  - services
  - replicationcontrollers
  - persistentvolumeclaims
  - persistentvolumes
  - resourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  - statefulsets
  - daemonsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  - csinodes
  - csidrivers
  - csistoragecapacities
  - volumeattachments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - queues
  - podgroups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - nodeinfo.volcano.sh
  resources:
  - numatopologies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - topology.volcano.sh
  resources:
  - hypernodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  - resourceclaims/status
  - deviceclasses
  - resourceslices
  - devicetaintrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.volcano.sh
  resources:
  - queues
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - nodes
  resourceNames:
  - t3dgq
  verbs:
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rf-v7-scheduler
  labels:
    gpu-lab/experiment: round7-rf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rf-v7-scheduler
subjects:
- kind: ServiceAccount
  name: volcano-rf-test
  namespace: gpu-rf-system
---
