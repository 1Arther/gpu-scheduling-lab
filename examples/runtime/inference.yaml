apiVersion: v1
kind: Pod
metadata:
  name: offline-inference
  labels:
    gpu-lab/workload-type: inference
spec:
  schedulerName: volcano
  containers:
    - name: workload
      image: placeholder-not-pulled-or-executed
      resources:
        limits:
          volcano.sh/vgpu-number: 1
          volcano.sh/vgpu-memory: 4096
          volcano.sh/vgpu-cores: 20
